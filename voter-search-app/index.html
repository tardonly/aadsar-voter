<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#c2185b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="मतदाता खोज">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>मतदाता खोज</title>
<style>
  /* font the printed slip is drawn with (slips.js) */
  @font-face { font-family: NotoDev; font-weight: 400; src: url(fonts/noto-sans-devanagari-devanagari-400-normal.woff2) format('woff2'); unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+25CC, U+A830-A839, U+A8E0-A8FF; }
  @font-face { font-family: NotoDev; font-weight: 400; src: url(fonts/noto-sans-devanagari-latin-400-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: NotoDev; font-weight: 700; src: url(fonts/noto-sans-devanagari-devanagari-700-normal.woff2) format('woff2'); unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+25CC, U+A830-A839, U+A8E0-A8FF; }
  @font-face { font-family: NotoDev; font-weight: 700; src: url(fonts/noto-sans-devanagari-latin-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  :root {
    --bg: #f3f4f6; --card: #fff; --ink: #111; --muted: #6b7280; --line: #d1d5db;
    --pink: #e0245e; --pink-dark: #c2185b; --accent: #1f4e8c; --bad: #b91c1c;
    --done: #16a34a; --coming: #facc15; --absent: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans Devanagari", "Kohinoor Devanagari", "Mangal", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: env(safe-area-inset-bottom); }
  button, input, select { font: inherit; }
  .hidden { display: none !important; }

  /* lock screen */
  #lock { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 8px; }
  .lockbox { margin: auto 0; width: 100%; max-width: 380px; background: var(--card); border-radius: 14px; padding: 24px 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08); text-align: center; }
  .lockbox img { width: 72px; height: 72px; border-radius: 16px; }
  .lockbox h1 { font-size: 22px; margin: 12px 0 2px; }
  .lockbox p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .lockbox input[type=password], .lockbox input[type=text] { width: 100%; padding: 12px 14px; font-size: 18px;
    border: 1.5px solid var(--line); border-radius: 10px; text-align: center; letter-spacing: 1px; }
  .lockbox label { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 12px 0; font-size: 14px; color: var(--muted); }
  .btn { width: 100%; padding: 12px; font-size: 18px; border: 0; border-radius: 10px; background: var(--pink-dark); color: #fff; font-weight: 600; }
  .btn:disabled { opacity: .6; }
  #lockMsg { min-height: 22px; margin-top: 10px; font-size: 14px; color: var(--bad); line-height: 1.5; }
  #lockMsg.info { color: var(--muted); }

  /* search screen */
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
    padding: calc(8px + env(safe-area-inset-top)) 12px 8px; }
  .titlebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .titlebar b { font-size: 17px; }
  .titlebar .who { font-size: 12px; color: var(--muted); font-weight: 400; display: block; }
  .titlebar button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 10px; font-size: 13px; color: var(--muted); flex: none; }
  .tb-actions { display: flex; gap: 6px; flex: none; }
  #adminBtn { border-radius: 8px; padding: 4px 10px; font-size: 13px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
  .fields { display: grid; gap: 6px; }
  .fields input, .fields select { width: 100%; padding: 10px 12px; font-size: 17px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; }
  .fields input:focus, .fields select:focus { outline: none; border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; }
  #reset { padding: 0 12px; font-size: 15px; font-weight: 600; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--bad); }
  .row2 select { width: auto; }
  /* status lists: ✓ पूरा हुआ · आ रहे हैं · उपलब्ध नहीं · बाकी, with how many in each */
  .mtabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 6px; }
  .mtabs.three { grid-template-columns: repeat(3, 1fr); }
  .mtabs button { padding: 4px 2px; font-size: 13px; font-weight: 600; line-height: 1.3; border: 1.5px solid; border-radius: 9px; background: #fff; }
  .mtabs button b { display: block; font-size: 16px; min-height: 1.3em; }
  .mtabs .done { border-color: var(--done); color: #15803d; } .mtabs .done.on { background: var(--done); color: #fff; }
  .mtabs .coming { border-color: #ca8a04; color: #854d0e; } .mtabs .coming.on { background: var(--coming); color: #422006; }
  .mtabs .absent { border-color: var(--absent); color: var(--absent); } .mtabs .absent.on { background: var(--absent); color: #fff; }
  .mtabs .none { border-color: #9ca3af; color: #374151; } .mtabs .none.on { background: #4b5563; color: #fff; }
  #bigBtn { font-weight: 700; color: var(--ink); }
  #bigBtn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  #count { font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 18px; }
  #count.bad { color: var(--bad); }
  #wardPdf { margin-top: 6px; width: 100%; padding: 8px 10px; font-size: 15px; font-weight: 600; border: 1.5px solid var(--accent);
    border-radius: 10px; background: #fff; color: var(--accent); }
  #wardPdf:disabled { opacity: .7; }
  #app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
  main { flex: 1; width: 100%; padding: 10px 10px 24px; max-width: 640px; margin: 0 auto; }
  .hint { color: var(--muted); font-size: 14px; line-height: 1.6; padding: 8px 6px; }

  /* voter slip, modelled on the printed slip */
  .slip { background: var(--card); border: 1.5px solid #222; margin: 0 0 12px; font-size: 15px; }
  .slip .head { display: grid; grid-template-columns: 1fr auto; align-items: start; gap: 8px; padding: 6px 8px 0; }
  .slip .tools { display: flex; flex-wrap: wrap; gap: 6px; }
  .slip .tools button { padding: 4px 10px; font-size: 13.5px; font-weight: 600; color: var(--accent);
    background: #fff; border: 1.5px solid var(--line); border-radius: 8px; }
  .slip .tools .fam.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  /* the other voters at the same house number, opened under a slip */
  .family { margin: -4px 0 14px 10px; padding: 8px 0 0 10px; border-left: 3px solid var(--accent); }
  .family .fh { font-size: 13.5px; font-weight: 600; color: var(--accent); margin: 0 0 8px; }
  .family .slip:last-child { margin-bottom: 0; }
  .slip .meta { font-size: 12.5px; text-align: right; line-height: 1.5; white-space: nowrap; }
  .slip .meta span + span { margin-left: 12px; }
  .slip .idline { display: flex; align-items: center; gap: 10px; padding: 2px 8px 4px; }
  .slip .boxno { min-width: 46px; padding: 0 6px; border: 1.5px solid #222; text-align: center; font-weight: 700;
    font-family: "Times New Roman", Georgia, serif; font-size: 20px; line-height: 28px; }
  .slip .epic { font-size: 22px; font-weight: 700; font-family: Arial, Helvetica, sans-serif; letter-spacing: .3px; word-break: break-all; }
  .slip .epic.none { font-size: 13px; font-weight: 400; color: var(--muted); }
  .slip .line { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline; padding: 3px 8px; }
  .slip .line .k { font-weight: 600; }
  .slip .line b { font-size: 17px; }
  .slip .line .r { text-align: right; white-space: nowrap; }
  .slip .line .r b { margin-left: 4px; }
  .slip .line .r .g { margin-left: 10px; }
  .slip .en { font-size: 12px; color: var(--muted); margin-left: 4px; font-weight: 400; }
  .slip .kendra { border-top: 1px solid #222; margin: 6px 6px 0; padding: 4px 4px 3px; font-size: 13px; text-align: center; }
  .slip .time { background: var(--pink); color: #fff; text-align: center; font-size: 13px; padding: 3px 4px; }
  /* status mark the admin sets: a coloured bar on top of the slip, seen by everyone */
  .slip .mark { display: none; padding: 4px 8px; font-size: 14px; font-weight: 700; color: #fff; }
  .slip .mark small { font-weight: 400; font-size: 12px; margin-left: 6px; opacity: .9; }
  .slip[data-mark] .mark { display: block; }
  .slip[data-mark=done] { border-color: var(--done); } .slip[data-mark=done] .mark { background: var(--done); }
  .slip[data-mark=coming] { border-color: #ca8a04; } .slip[data-mark=coming] .mark { background: var(--coming); color: #422006; }
  .slip[data-mark=absent] { border-color: var(--absent); } .slip[data-mark=absent] .mark { background: var(--absent); }
  .slip .acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px; border-top: 1px dashed var(--line); background: #fafafa; }
  .slip .acts button { padding: 8px 4px; font-size: 15px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
  .slip .acts .m { font-weight: 600; }
  .slip .acts .m.done { border-color: var(--done); color: var(--done); }
  .slip .acts .m.coming { border-color: #ca8a04; color: #854d0e; }
  .slip .acts .m.absent { border-color: var(--absent); color: var(--absent); }
  .slip .acts .m.on.done { background: var(--done); color: #fff; }
  .slip .acts .m.on.coming { background: var(--coming); color: #422006; }
  .slip .acts .m.on.absent { background: var(--absent); color: #fff; }
  #printArea { display: none; }
  @page { size: A4; margin: 0; }
  @media print {
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block; }
    #printArea img { display: block; }   /* sized in mm by oneSlip() */
  }
  /* bigger text (अ+ button), remembered on this phone */
  html.big .slip, html.big .family .fh, html.big .hint { zoom: 1.2; }
  html.big .fields input, html.big .fields select { font-size: 20px; }
  html.big #count { font-size: 15px; }
  #more { margin: 4px auto 0; display: block; width: auto; padding: 10px 22px; font-size: 16px; }
  /* "Powered by DigyAi" footer */
  .powered { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 0 auto; padding: 8px 0 calc(10px + env(safe-area-inset-bottom)); width: fit-content;
    font-size: 12.5px; color: var(--muted); text-decoration: none; }
  .powered img { width: 20px; height: 20px; border-radius: 5px; }
  .powered b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>

<section id="lock">
  <div class="lockbox">
    <img src="icon-192.png" alt="">
    <h1>मतदाता खोज</h1>
    <p>ग्राम पंचायत आडसर · वार्ड 1–11</p>
    <form id="lockForm" autocomplete="off">
      <input id="pw" type="password" placeholder="पासवर्ड डालें" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <label><input id="showPw" type="checkbox"> पासवर्ड दिखाएं</label>
      <label><input id="remember" type="checkbox" checked> इस फ़ोन पर याद रखें</label>
      <button class="btn" id="unlockBtn" type="submit">खोलें</button>
    </form>
    <div id="lockMsg"></div>
  </div>
  <a class="powered" href="https://digyai.com" target="_blank" rel="noopener">Powered by <img src="digyai-logo.png" alt=""><b>DigyAi</b></a>
</section>

<section id="app" class="hidden">
  <header>
    <div class="titlebar"><b>मतदाता खोज · आडसर<span class="who" id="who"></span></b>
      <span class="tb-actions"><button id="bigBtn" type="button" aria-label="बड़े अक्षर" aria-pressed="false">अ+</button><a id="adminBtn" class="hidden" href="admin.html">एडमिन</a><button id="lockBtn" type="button">लॉग आउट</button></span></div>
    <div class="fields">
      <input id="qName" type="search" placeholder="नाम / Name / बॉक्स नं. / Voter ID" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <div class="row2">
        <input id="qRel" type="search" placeholder="पिता / पति का नाम" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <select id="qWard" aria-label="वार्ड"><option value="">सभी वार्ड</option></select>
        <button id="reset" class="hidden" type="button" aria-label="खोज साफ़ करें">✕ साफ़</button>
      </div>
      <div id="qMark" class="mtabs hidden" role="group" aria-label="निशान वाली सूची">
        <button type="button" class="done" data-m="done" aria-pressed="false">✓ पूरा हुआ<b></b></button>
        <button type="button" class="coming" data-m="coming" aria-pressed="false">आ रहे हैं<b></b></button>
        <button type="button" class="absent" data-m="absent" aria-pressed="false">उपलब्ध नहीं<b></b></button>
        <button type="button" class="none" data-m="none" aria-pressed="false">बाकी<b></b></button>
      </div>
    </div>
    <button id="wardPdf" class="hidden" type="button"></button>
    <div id="count"></div>
  </header>
  <main>
    <div id="results"></div>
    <button class="btn hidden" id="more" type="button">और दिखाएं</button>
  </main>
  <a class="powered" href="https://digyai.com" target="_blank" rel="noopener">Powered by <img src="digyai-logo.png" alt=""><b>DigyAi</b></a>
</section>
<div id="printArea"><img alt=""></div>

<script>
'use strict';
const PS = 3, ZP = 35;                       // पंचायत समिति / जिला परिषद निर्वाचन क्षेत्र
const TIME = 'प्रातः 7 से सायं 5 बजे तक';
const POLL_TIME = `मतदान समय : ${TIME}`;
const WARDS = 11;
const $ = (id) => document.getElementById(id);
const store = {  // localStorage can be blocked (private mode); then the user just logs in each time
  get(k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v, keep) { try { (keep ? localStorage : sessionStorage).setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} },
};
// this app is online-only: remove any offline cache an older version may have installed
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {});
if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});

for (let w = 1; w <= WARDS; w++) $('qWard').add(new Option(`वार्ड ${w}`, w));

const MSG = {
  wrong: 'पासवर्ड गलत है',
  retired: 'यह पासवर्ड बंद कर दिया गया है — एडमिन से नया पासवर्ड लें',
  login: 'दोबारा लॉगिन करें',
  logged_out: 'आपको लॉग आउट कर दिया गया है — दोबारा लॉगिन करें',
  other_device: 'यह पासवर्ड किसी दूसरे फ़ोन पर खोला गया है, इसलिए यहाँ से लॉग आउट हो गया। एक पासवर्ड एक समय पर एक ही फ़ोन पर चलता है।',
  too_many: 'बहुत बार गलत पासवर्ड — 15 मिनट बाद कोशिश करें',
  slow_down: 'बहुत तेज़ खोज — एक मिनट रुककर कोशिश करें',
  admin: 'यह सिर्फ़ एडमिन कर सकता है',
  no_ward: 'पूरे वार्ड की सूची देखने की अनुमति नहीं है — नाम, पिता/पति का नाम या बॉक्स नंबर लिखें',
  no_mark: 'आपको निशान लगाने की अनुमति नहीं है',
  no_lists: 'आपको निशान वाली सूची देखने की अनुमति नहीं है',
  no_pdf: 'आपको पूरे वार्ड की PDF की अनुमति नहीं है',
  offline: 'इंटरनेट नहीं है — इंटरनेट चालू करें',
  server: 'सर्वर में दिक्कत — थोड़ी देर बाद कोशिश करें',
};
async function api(path, payload) {
  let r;
  try {
    r = await fetch(`api/${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  } catch (e) { return { error: 'offline' }; }
  try { return await r.json(); } catch (e) { return { error: 'server' }; }
}

// ---------- login ----------
function showLock(msg, info) {
  $('app').classList.add('hidden'); $('lock').classList.remove('hidden');
  $('lockMsg').textContent = msg || ''; $('lockMsg').classList.toggle('info', !!info);
}
function signOut(msg) {
  store.del('tok'); store.del('who');
  $('results').innerHTML = ''; $('qName').value = ''; $('qRel').value = ''; $('qWard').value = ''; markFilter = ''; $('count').textContent = '';
  showLock(msg);
}
let isAdmin = false, perms = [];
const can = (p) => isAdmin || perms.includes(p);   // what the admin allows this person (the server checks too)
function showApp(name, admin, allowed) {
  isAdmin = !!admin; perms = allowed || [];
  $('who').textContent = name ? `उपयोगकर्ता: ${name}` : '';
  $('adminBtn').classList.toggle('hidden', !admin);
  $('lock').classList.add('hidden'); $('app').classList.remove('hidden');
  search();
}

$('showPw').addEventListener('change', (e) => { $('pw').type = e.target.checked ? 'text' : 'password'; });
$('lockForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = $('pw').value.trim();
  if (!password) return;
  $('unlockBtn').disabled = true; showLock('खुल रहा है…', true);
  const r = await api('unlock', { password });
  $('unlockBtn').disabled = false;
  if (r.error) return showLock(MSG[r.error] || MSG.server);
  const keep = $('remember').checked;
  store.set('tok', r.token, keep); store.set('who', r.name, keep);
  $('pw').value = '';
  showApp(r.name, r.admin, r.perms);
});
$('lockBtn').addEventListener('click', () => {
  api('logout', { token: store.get('tok') });   // close the session on the server; no need to wait
  signOut('');
});

// ---------- search ----------
let seq = 0, shown = 0, total = 0, lastKey = 0, markFilter = '', counts = null;
function hint() {
  $('results').innerHTML = '<div class="hint">नाम या पिता/पति का नाम हिंदी या English में लिखें।<br>' +
    'गलत स्पेलिंग भी चलेगी, जैसे <b>bhanvarlal</b>, <b>mangi lal</b>, <b>मांगीलाल</b>।<br>' +
    'बॉक्स नंबर (जैसे <b>25</b>, वार्ड चुनकर, या <b>3/25</b> = वार्ड 3 का बॉक्स 25) या Voter ID (जैसे <b>XHE1102649</b>) से भी खोज सकते हैं।' +
    (can('ward') ? '<br>सिर्फ़ वार्ड चुनें तो उस वार्ड के सभी मतदाता बॉक्स क्रम में दिखेंगे।' : '') +
    (can('lists') ? '<br>ऊपर के रंगीन बटन से पूरा हुआ / आ रहे हैं / उपलब्ध नहीं वाले सभी मतदाता देखें (वार्ड चुनें तो उसी वार्ड के)।' : '') + '</div>';
}
const FILTER = { none: 'बाकी (बिना निशान)', done: '✓ पूरा हुआ', coming: 'आ रहे हैं', absent: 'उपलब्ध नहीं' };
// the status buttons: shown to people allowed the lists, or the whole ward (बाकी needs a ward and the whole-ward permission)
function markTabs(ward) {
  const status = can('lists') || (ward && can('ward')), rest = !!ward && can('ward');
  if (markFilter === 'none' ? !rest : markFilter && !status) markFilter = '';
  $('qMark').classList.toggle('hidden', !status);
  $('qMark').classList.toggle('three', !rest);
  $('qMark').querySelector('.none').classList.toggle('hidden', !rest);
  $('qMark').querySelectorAll('button').forEach((b) => {
    b.classList.toggle('on', b.dataset.m === markFilter); b.setAttribute('aria-pressed', b.dataset.m === markFilter);
    b.querySelector('b').textContent = counts && b.dataset.m in counts ? counts[b.dataset.m] : '';
  });
  return status;
}
async function search(more = false) {
  const q = { name: $('qName').value.trim(), rel: $('qRel').value.trim(), ward: $('qWard').value };
  const named = !!(q.name || q.rel);
  const wantCounts = markTabs(q.ward);
  q.mark = markFilter;
  $('count').classList.remove('bad');
  wardButton();
  $('reset').classList.toggle('hidden', !(named || q.ward || q.mark));
  const mine = ++seq;                             // a search still on its way is dropped
  if (!named && !q.ward && !q.mark) {
    hint(); $('count').textContent = ''; $('more').classList.add('hidden'); shown = 0;
    if (wantCounts) { const r = await api('search', { counts: 1, token: store.get('tok') }); if (mine === seq && r.counts) { counts = r.counts; markTabs(''); } }
    return;
  }
  if (!named && !can('ward') && (!q.mark || q.mark === 'none')) { $('results').innerHTML = '';
    $('count').textContent = MSG.no_ward; $('more').classList.add('hidden'); shown = 0; return; }
  if (!more) $('count').textContent = 'खोज रहे हैं…';
  // lists without a name page on from the last slip shown, so slips marked meanwhile don't shift the list
  const r = await api('search', { ...q, offset: more ? shown : 0, after: more ? lastKey : 0, counts: wantCounts ? 1 : 0, token: store.get('tok') });
  if (mine !== seq) return;                       // a newer search has started
  if (loggedOut(r)) return;
  if (r.error) { $('count').textContent = MSG[r.error] || MSG.server; $('count').classList.add('bad'); return; }
  if (r.perms) updatePerms(r.perms);
  if (r.counts) { counts = r.counts; markTabs(q.ward); }
  total = r.total;
  if (!more) { $('results').innerHTML = ''; shown = 0; }
  const frag = document.createDocumentFragment();
  for (const v of r.results) frag.appendChild(slip(v));
  $('results').appendChild(frag);
  shown += r.results.length;
  const lastV = r.results[r.results.length - 1];
  if (lastV) lastKey = lastV.ward * 10000 + lastV.box;
  const which = q.mark ? `${FILTER[q.mark]} ` : '';
  const where = q.ward ? `वार्ड ${q.ward}` : 'सभी वार्ड';
  const found = named ? `${total} ${which}मतदाता मिले` : `${where} · ${q.mark ? which : 'सभी '}${total} मतदाता, ${q.ward ? '' : 'वार्ड और '}बॉक्स क्रम में`;
  $('count').textContent = total ? found + (total > shown ? ` · ${shown} दिखाए` : '')
    : q.mark ? `${where} में ${which}कोई मतदाता नहीं` : 'कोई मतदाता नहीं मिला — स्पेलिंग बदलकर देखें';
  $('more').classList.toggle('hidden', !r.more);
}

// the admin can change what this person may do at any time; the next answer from the server says so
function updatePerms(p) {
  if (isAdmin || p.join() === perms.join()) return;
  perms = p;
  wardButton();
  if (shown) search();   // redraw the slips with the right buttons
}

const loggedOut = (r) => ['retired', 'login', 'logged_out', 'other_device'].includes(r.error) && (signOut(MSG[r.error]), true);

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function kv(label, value) { const f = document.createDocumentFragment(); f.append(label, el('b', null, value)); return f; }

function slip(r, inFamily) {
  const [bhag, ...rest] = String(r.kendra || '').split('-');
  const d = el('div', 'slip');
  d.dataset.key = `${r.ward}:${r.box}`;
  const head = el('div', 'head');
  const tools = el('div', 'tools');
  if (can('print')) {
    const pp = el('button', 'pp', 'प्रिंट / PDF'); pp.type = 'button';
    pp.onclick = () => oneSlip(r, navigator.standalone ? 'pdf' : 'print', pp);   // iPhone home-screen apps can't print: save the PDF
    tools.append(pp);
  }
  if (!inFamily && String(r.house || '').trim()) {
    const fb = el('button', 'fam', 'परिवार'); fb.type = 'button';
    fb.onclick = () => toggleFamily(r, d, fb);
    tools.append(fb);
  }
  head.append(tools);
  const meta = el('div', 'meta');
  const m1 = el('div'); m1.append(el('span', null, `पं.सं. ${PS}`), el('span', null, `जि.प. ${ZP}`));
  const m2 = el('div'); m2.append(el('span', null, `वार्ड नं. : ${r.ward}`), el('span', null, `भाग सं. ${bhag.trim()}`));
  meta.append(m1, m2); head.append(meta);

  const idl = el('div', 'idline');
  idl.append(el('div', 'boxno', r.box), r.epic ? el('div', 'epic', r.epic) : el('div', 'epic none', 'Voter ID नहीं'));

  const l1 = el('div', 'line');
  const n = el('div'); n.append(el('span', 'k', 'नाम: '), el('b', null, r.hname), el('span', 'en', r.name));
  const h = el('div', 'r'); h.append(kv('मकान संख्या:', r.house || '—'));
  l1.append(n, h);

  const l2 = el('div', 'line');
  const p = el('div'); p.append(el('span', 'k', `${r.rel} का नाम: `), el('b', null, r.hrel), el('span', 'en', r.relname));
  const ag = el('div', 'r'); ag.append(kv('आयु:', r.age)); const g = el('span', 'g'); g.append(kv('लिंग:', r.sex)); ag.append(g);
  l2.append(p, ag);

  const k = el('div', 'kendra'); k.append('मतदान केन्द्र : ', el('b', null, bhag.trim()), ` - ${rest.join('-').trim()}`);
  d.append(el('div', 'mark'), head, idl, l1, l2, k, el('div', 'time', POLL_TIME));
  if (can('mark')) d.append(markButtons(r, d));
  d.dataset.by = r.markBy || ''; d.dataset.at = r.markAt || '';
  showMark(d, r.mark, r.markBy, r.markAt);
  return d;
}

// everyone else at the same house number in the ward, opened under the slip
async function toggleFamily(r, d, btn) {
  const open = d.nextElementSibling && d.nextElementSibling.classList.contains('family') ? d.nextElementSibling : null;
  if (open) { open.remove(); btn.classList.remove('on'); btn.textContent = 'परिवार'; return; }
  btn.disabled = true; btn.textContent = 'ला रहे हैं…';
  const res = await api('search', { family: `${r.ward}:${r.box}`, token: store.get('tok') });
  btn.disabled = false; btn.textContent = 'परिवार';
  if (loggedOut(res)) return;
  if (res.error) { alert(MSG[res.error] || MSG.server); return; }
  const others = res.results.filter((v) => v.box !== r.box);
  const box = el('div', 'family');
  box.append(el('div', 'fh', others.length ? `मकान नं. ${r.house} · वार्ड ${r.ward} · इसी मकान के और ${others.length} मतदाता`
    : `मकान नं. ${r.house} पर और कोई मतदाता नहीं`));
  for (const v of others) box.append(slip(v, true));
  d.after(box);
  btn.classList.add('on'); btn.textContent = 'परिवार छुपाएं';
}

// ---------- status marks (set by the admin and people allowed to; everyone sees the bar, who set it and when) ----------
const MARKS = { done: '✓ पूरा हुआ', coming: 'आ रहे हैं', absent: 'उपलब्ध नहीं' };
const when = (iso) => new Date(iso).toLocaleString('hi-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
function showMark(d, m, by, at) {
  if (MARKS[m]) d.dataset.mark = m; else delete d.dataset.mark;
  const bar = d.querySelector('.mark');
  bar.textContent = MARKS[m] || '';
  if (MARKS[m] && (by || at)) bar.append(el('small', null, [by, at && when(at)].filter(Boolean).join(', ')));
  d.querySelectorAll('.acts .m').forEach((b) => b.classList.toggle('on', b.dataset.m === m));
}
async function setMark(r, d, m) {
  const before = [d.dataset.mark || '', d.dataset.by || '', d.dataset.at || ''];
  const status = before[0] === m ? '' : m;        // tapping the lit button again removes the mark
  showMark(d, status);
  const res = await api('mark', { token: store.get('tok'), ward: r.ward, box: r.box, status });
  if (res.error) { showMark(d, ...before); if (!loggedOut(res)) alert(MSG[res.error] || MSG.server); return; }
  d.dataset.by = res.by; d.dataset.at = res.at;
  showMark(d, status, res.by, res.at);
  // keep the numbers on the status buttons right without asking the server
  const w = $('qWard').value;
  if (counts && (!w || +w === r.ward)) { counts[before[0] || 'none']--; counts[status || 'none']++; markTabs(w); }
}
// marks set on another phone reach this one without a new search
async function refreshMarks() {
  const slips = [...document.querySelectorAll('.slip[data-key]')];
  if (!slips.length || document.hidden || !store.get('tok')) return;
  const r = await api('marks', { token: store.get('tok'), keys: slips.map((d) => d.dataset.key) });
  if (loggedOut(r) || !r.marks) return;
  for (const d of slips) {
    const k = r.marks[d.dataset.key];
    if (!k) continue;
    d.dataset.by = k.by; d.dataset.at = k.at;
    showMark(d, k.m, k.by, k.at);
  }
  if (r.perms) updatePerms(r.perms);
}
setInterval(refreshMarks, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshMarks(); });

function markButtons(r, d) {
  const a = el('div', 'acts');
  for (const m of Object.keys(MARKS)) {
    const b = el('button', `m ${m}`, MARKS[m].replace('✓ ', '')); b.type = 'button'; b.dataset.m = m;
    b.onclick = () => setMark(r, d, m);
    a.append(b);
  }
  return a;
}

// ---------- printed slips (drawn like the paper slip by slips.js; jsPDF and fonts load on first use) ----------
let slipLib = null;
function loadScript(src) {
  return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
}
async function slipTools() {
  slipLib ||= Promise.all([loadScript('lib/jspdf.umd.min.js'), loadScript('slips.js')]).then(() => Slips.loadFonts());
  try { await slipLib; } catch (e) { slipLib = null; throw e; }
}
function slipMeta(ward, kendra) {
  const [no, ...rest] = String(kendra || '').split('-');
  return { ps: PS, zp: ZP, ward, bhag: no.trim(), kendraNo: no.trim(), kendraName: rest.join('-').trim(), time: TIME };
}
const slipVoter = (r) => ({ box: r.box, epic: r.epic, name: r.hname, relation: r.rel, relative: r.hrel, house: r.house, age: r.age, gender: r.sex });

// one slip in the top-left corner of an A4 page: printed, or saved as a PDF
async function oneSlip(r, how, btn) {
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'बन रही है…';
  try {
    await slipTools();
    const page = Slips.single(slipVoter(r), slipMeta(r.ward, r.kendra));
    if (how === 'pdf') Slips.singlePdf(page, `पर्ची-वार्ड-${r.ward}-बॉक्स-${r.box}.pdf`);
    else {
      const img = document.querySelector('#printArea img');
      const { canvas, wMm, hMm } = Slips.corner(page);
      img.style.width = `${wMm}mm`; img.style.height = `${hMm}mm`;
      img.src = canvas.toDataURL('image/png');
      await img.decode();
      window.print();
    }
  } catch (e) { alert(MSG.offline); }
  btn.disabled = false; btn.textContent = label;
}

// every slip of the chosen ward, 12 per A4 page
function wardButton() {
  const w = $('qWard').value;
  $('wardPdf').classList.toggle('hidden', !w || !can('wardPdf'));   // whole-ward PDF: admin, and people allowed it
  if (!$('wardPdf').disabled) $('wardPdf').textContent = `⬇ वार्ड ${w} की सभी पर्चियाँ (PDF)`;
}
$('wardPdf').addEventListener('click', async () => {
  const w = $('qWard').value, b = $('wardPdf');
  if (!w) return;
  b.disabled = true; b.textContent = 'सूची ला रहे हैं…';
  try {
    const [r] = await Promise.all([api('ward', { token: store.get('tok'), ward: w }), slipTools()]);
    if (loggedOut(r)) return;
    if (r.error) { alert(MSG[r.error] || MSG.server); return; }
    await Slips.savePdf(r.voters.map(slipVoter), slipMeta(r.ward, r.kendra), `आडसर-वार्ड-${r.ward}-मतदाता-पर्ची.pdf`,
      (done, total) => { b.textContent = `PDF बन रही है… ${done}/${total} पेज`; });
  } catch (e) { alert(MSG.offline); }
  finally { b.disabled = false; wardButton(); }
});

let timer;
for (const id of ['qName', 'qRel']) $(id).addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => search(), 300); });
$('qWard').addEventListener('change', () => search());
$('qMark').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
  markFilter = markFilter === b.dataset.m ? '' : b.dataset.m;   // tap the lit one again to go back
  search(); scrollTo(0, 0);
}));
$('more').addEventListener('click', () => search(true));
// one tap empties both names, the ward and the mark filter, back to the start
$('reset').addEventListener('click', () => {
  clearTimeout(timer);
  $('qName').value = ''; $('qRel').value = ''; $('qWard').value = ''; markFilter = '';
  search(); scrollTo(0, 0);
});
// bigger text, remembered on this phone
function setBig(on) {
  document.documentElement.classList.toggle('big', on);
  $('bigBtn').classList.toggle('on', on); $('bigBtn').setAttribute('aria-pressed', on);
  store.set('big', on ? '1' : '', true);
}
setBig(store.get('big') === '1');
$('bigBtn').addEventListener('click', () => setBig(!document.documentElement.classList.contains('big')));

// ---------- open straight into search if this phone is remembered, after checking the password is still active ----------
(async () => {
  const tok = store.get('tok');
  if (!tok) return;
  showLock('जाँच रहे हैं…', true);
  const r = await api('check', { token: tok });
  if (r.error) return showLock(MSG[r.error] || MSG.server);
  if (!r.active) return signOut(MSG[r.reason] || MSG.login);
  showApp(r.name, r.admin, r.perms);
})();
</script>
